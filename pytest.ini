[pytest]
DJANGO_SETTINGS_MODULE = config.settings_test
pythonpath =
    .
    alpha_pos_core
testpaths =
    admins/tests
    couriers/tests
    smartfood/tests
    tests
python_files = test_*.py *_tests.py
python_classes = Test*
python_functions = test_*
addopts = -ra --strict-markers --strict-config --ignore=alpha_pos_core
markers =
    slow: tests that exercise multiple subsystems
